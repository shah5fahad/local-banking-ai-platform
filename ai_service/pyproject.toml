[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-service"
version = "0.1.0"
description = "AI/agent service: LangGraph orchestration, RAG, HITL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "python-json-logger>=2.0",
    "httpx>=0.27",
    "langgraph>=0.1",
    "langchain-core>=0.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "banking-common",
    "langchain-google-genai>=1.0",
    "langchain-nvidia-ai-endpoints>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-python-jose",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "S", "RUF"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN001", "ANN002", "ANN003", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banking-common"
version = "0.1.0"
description = "Shared utilities: logging, masking, error schema, settings base"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["banking_common"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "S", "RUF"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN001", "ANN002", "ANN003"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e common[dev]
          pip install -e banking_service[dev]
          pip install -e ai_service[dev]

      - name: Ruff lint
        run: |
          python -m ruff check common/banking_common banking_service/app ai_service/app

      - name: Mypy type-check (common)
        run: cd common && python -m mypy banking_common

      - name: Mypy type-check (banking_service)
        run: cd banking_service && python -m mypy app

      - name: Mypy type-check (ai_service)
        run: cd ai_service && python -m mypy app

  test-banking:
    name: Test banking_service
    runs-on: ubuntu-latest
    env:
      BANKING_DATABASE_URL: sqlite:///./test_banking.db
      BANKING_SECRET_KEY: ci-test-secret-banking
      BANKING_APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e common
          pip install -e banking_service[dev]

      - name: Run migrations
        run: |
          cd banking_service && alembic upgrade head

      - name: Run tests
        run: |
          cd banking_service && python -m pytest -v --tb=short

  test-common:
    name: Test common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e common[dev]

      - name: Run tests
        run: cd common && python -m pytest -v --tb=short

  test-ai:
    name: Test ai_service
    runs-on: ubuntu-latest
    env:
      AI_DATABASE_URL: sqlite:///./test_ai.db
      AI_BANKING_SERVICE_URL: http://localhost:8000
      AI_SECRET_KEY: ci-test-secret-ai
      AI_APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e common
          pip install -e ai_service[dev]

      - name: Run migrations
        run: |
          cd ai_service && alembic upgrade head

      - name: Run tests
        run: |
          cd ai_service && python -m pytest -v --tb=short
